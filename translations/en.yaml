configuration:
  daily_check_time:
    name: Daily check time
    description: When the daily check runs, as HH:MM on a 24-hour clock in Home Assistant's time zone.
  google:
    name: Google
    description: >-
      The app you registered in Google Cloud (setup step 2 on the Documentation tab), shared by every
      Google account. Connect the Google accounts themselves on the Contact Sync page.
    fields:
      client_id:
        name: Client ID
      client_secret:
        name: Client secret
  icloud_accounts:
    name: iCloud accounts
    description: One entry per iCloud account. Create its app-specific password for Contact Sync at account.apple.com.
    fields:
      label:
        name: Label
        description: Any name you like, shown on the Contact Sync page.
      apple_id:
        name: Apple ID
      app_password:
        name: App-specific password
