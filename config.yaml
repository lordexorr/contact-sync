name: Contact Sync
version: "0.2.6"
slug: contact_sync
description: Keeps contacts in sync across iCloud and Google accounts. Checks daily and writes nothing until you apply the changes.
arch:
  - aarch64
  - amd64
ingress: true
ingress_port: 8099
panel_icon: mdi:contacts
panel_title: Contact Sync
map:
  - type: addon_config
    read_only: false
options:
  daily_check_time: "08:00"
  google:
    client_id: ""
    client_secret: ""
  icloud_accounts: []
schema:
  daily_check_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  google:
    client_id: str?
    client_secret: password?
  icloud_accounts:
    - label: str
      apple_id: str?
      app_password: password?
